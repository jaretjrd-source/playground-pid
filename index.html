<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Playground interactivo de control PID: ajusta Kp, Ki y Kd y observa la respuesta de una planta en vivo." />
    <title>Playground de control PID</title>
  </head>
  <body>
    <div id="app">
      <h1>Playground de control PID</h1>
      <p class="intro">
        Fase 1: la planta sola (lazo abierto). Mueve la entrada <code>u</code> y
        observa cómo la salida <code>v</code> la persigue con retraso.
      </p>

      <canvas id="grafica"></canvas>

      <div class="controles">
        <label for="slider-u">
          <span>Entrada <code>u</code>: <strong id="valor-u">0.00</strong></span>
          <input type="range" id="slider-u" min="0" max="2" step="0.01" value="0" />
        </label>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
