<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Playground interactivo de control PID: ajusta Kp, Ki y Kd y observa la respuesta de una planta en vivo." />
    <title>Playground de control PID</title>
  </head>
  <body>
    <div id="app">
      <h1>Playground de control PID</h1>
      <p class="intro">
        Fase 2: lazo cerrado. El PID mide el error (objetivo − salida) y ajusta
        la entrada <code>u</code> solo. Mueve <code>Kp</code>, <code>Ki</code> y
        <code>Kd</code> y reinicia para ver el nuevo arranque.
      </p>

      <canvas id="grafica"></canvas>

      <div class="controles">
        <label for="slider-kp">
          <span>Kp — proporcional: <strong id="valor-kp">1.50</strong></span>
          <input type="range" id="slider-kp" min="0" max="10" step="0.1" value="1.5" />
        </label>
        <label for="slider-ki">
          <span>Ki — integral: <strong id="valor-ki">0.80</strong></span>
          <input type="range" id="slider-ki" min="0" max="5" step="0.05" value="0.8" />
        </label>
        <label for="slider-kd">
          <span>Kd — derivativo: <strong id="valor-kd">0.08</strong></span>
          <input type="range" id="slider-kd" min="0" max="2" step="0.01" value="0.08" />
        </label>
        <button type="button" id="btn-reiniciar">Reiniciar simulación</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
