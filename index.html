<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Playground interactivo de control PID: ajusta Kp, Ki y Kd y observa la respuesta de una planta en vivo." />
    <title>Playground de control PID</title>
  </head>
  <body>
    <div id="app">
      <h1>Playground de control PID</h1>
      <p class="intro">
        Fase 3: un playground. Ajusta las ganancias, prueba un preset, cambia el
        objetivo y observa cómo responde el lazo cerrado.
      </p>

      <canvas id="grafica"></canvas>

      <div class="controles">
        <fieldset>
          <legend>Ganancias del PID</legend>

          <label for="slider-kp">
            <span>Kp — proporcional: <strong id="valor-kp">3.00</strong></span>
            <input type="range" id="slider-kp" min="0" max="10" step="0.1" value="3" />
          </label>
          <label for="slider-ki">
            <span>Ki — integral: <strong id="valor-ki">1.50</strong></span>
            <input type="range" id="slider-ki" min="0" max="10" step="0.05" value="1.5" />
          </label>
          <label for="slider-kd">
            <span>Kd — derivativo: <strong id="valor-kd">0.25</strong></span>
            <input type="range" id="slider-kd" min="0" max="2" step="0.01" value="0.25" />
          </label>

          <div class="botones">
            <button type="button" data-preset="p">Solo P</button>
            <button type="button" data-preset="pi">PI</button>
            <button type="button" data-preset="pid">PID ajustado</button>
            <button type="button" data-preset="osc">Ki muy alto (oscila)</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Objetivo</legend>

          <label for="slider-sp">
            <span>Setpoint: <strong id="valor-sp">1.00</strong></span>
            <input type="range" id="slider-sp" min="0.3" max="1.5" step="0.05" value="1" />
          </label>

          <div class="botones">
            <button type="button" id="btn-escalon">Nuevo escalón</button>
            <button type="button" id="btn-reiniciar">Reiniciar simulación</button>
          </div>
        </fieldset>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
